<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Keycloak – Select User</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 420px;
        }

        h1 {
            font-size: 1.25rem;
            color: #333;
            margin-bottom: .25rem;
        }

        p.subtitle {
            color: #666;
            font-size: .85rem;
            margin-bottom: 1.5rem;
        }

        .user-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: .5rem;
        }

        .user-btn {
            display: flex;
            align-items: center;
            gap: .75rem;
            width: 100%;
            padding: .75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
            transition: background .15s, border-color .15s;
            font-size: .95rem;
            color: #222;
            text-align: left;
        }

        .user-btn:hover {
            background: #e9ecf3;
            border-color: #aab;
        }

        .user-btn:active {
            background: #dde1eb;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #4a7cff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: .9rem;
            flex-shrink: 0;
        }

        .user-info {
            line-height: 1.3;
        }

        .user-name {
            font-weight: 600;
        }

        .user-email {
            font-size: .8rem;
            color: #888;
        }

        .user-roles {
            display: flex;
            flex-wrap: wrap;
            gap: .25rem;
            margin-top: .35rem;
        }

        .role-badge {
            display: inline-block;
            font-size: .65rem;
            padding: .1rem .4rem;
            border-radius: 3px;
            background: #e8eaf6;
            color: #3949ab;
            font-weight: 500;
            line-height: 1.4;
        }

        .role-badge.resource {
            background: #e0f2f1;
            color: #00796b;
        }

        .role-section {
            font-size: .6rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: .03em;
            margin-top: .15rem;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Sign in</h1>
        <p class="subtitle">Select an account to continue</p>
        <ul class="user-list">
            {{range $i, $user := .Users}}
            <li>
                <form method="POST">
                    {{range $k, $v := $.Params}}
                    <input type="hidden" name="{{$k}}" value="{{$v}}">
                    {{end}}
                    <input type="hidden" name="selected_user_index" value="{{$i}}">
                    <button type="submit" class="user-btn">
                        <span class="avatar">{{initial $user.Name}}</span>
                        <span class="user-info">
                            <span class="user-name">{{$user.Name}}</span><br>
                            <span class="user-email">{{$user.Email}}</span>
                            <span class="user-roles">
                                {{- if $user.RealmAccess.Roles}}
                                <span class="role-section">Realm</span>
                                {{range $user.RealmAccess.Roles}}<span class="role-badge">{{.}}</span>{{end}}
                                {{- end}}
                                {{- range $res, $access := $user.ResourceAccess}}
                                {{- if $access.Roles}}
                                <span class="role-section">{{$res}}</span>
                                {{range $access.Roles}}<span class="role-badge resource">{{.}}</span>{{end}}
                                {{- end}}
                                {{- end}}
                            </span>
                        </span>
                    </button>
                </form>
            </li>
            {{end}}
        </ul>
    </div>
</body>

</html>
