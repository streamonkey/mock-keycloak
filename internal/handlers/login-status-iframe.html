<!doctype html>
<html>

<head>
  <meta charset="utf-8">
</head>

<body>
  <script>
    function getSessionState() {
      var cookies = document.cookie.split(";")
      for (var i = 0; i < cookies.length; i++) {
        var c = cookies[i].trim()
        if (c.indexOf("MOCK_KEYCLOAK_SESSION=") === 0) {
          var value = c.substring("MOCK_KEYCLOAK_SESSION=".length)
          var parts = value.split("/")
          if (parts.length === 2) {
            return parts[1]
          }
        }
      }
      return null
    }

    window.addEventListener("message", function (event) {
      if (typeof event.data === "string" && event.data.split(" ").length === 2) {
        var parts = event.data.split(" ")
        var receivedSessionState = parts[1]
        var cookieSessionState = getSessionState()

        if (cookieSessionState && cookieSessionState === receivedSessionState) {
          event.source.postMessage("unchanged", event.origin)
        } else {
          event.source.postMessage("changed", event.origin)
        }
      }
    });
  </script>
</body>

</html>
